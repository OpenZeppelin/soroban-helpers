[workspace]
resolver = "3"
members = [
  "crates/soroban-test-helpers",
  "crates/example",
  "crates/soroban-rs",
  "crates/soroban-rs-macros"
]
default-members = ["crates/soroban-test-helpers"]

[workspace.package]
edition = "2021"
rust-version = "1.85.0" #MSRV
repository = "https://github.com/OpenZeppelin/soroban-helpers"
documentation = "https://github.com/OpenZeppelin/soroban-helpers"
description = "A collection of helpers for writing tests for Soroban contracts"
license = "MIT"
keywords = ["soroban", "stellar", "blockchain", "smart-contracts", "testing"]

[workspace.dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
soroban-sdk = "25.1.0"
tokio = { git = "https://github.com/dicej/tokio", branch = "wasip2-take2", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
stellar-rpc-client = { git = "https://github.com/warp-driver/rs-stellar-rpc-client", branch = "wasip2-support" }
stellar-xdr = { version = "25.0.0", features = ["serde", "serde_json"] }
stellar-strkey = "0.0.16"
ed25519-dalek = "2.1.1"
sha2 = "0.10.8"
rand = "0.9.0"
hex = "0.4.3"
dotenv = "0.15.0"
async-trait = "0.1.88"
tempfile = "3.10.1"

# members
soroban-test-helpers = { path = "crates/soroban-test-helpers" }
soroban-rs = { path = "crates/soroban-rs" }
soroban-rs-macros = { path = "crates/soroban-rs-macros", version = "0.2.3" }

[patch.crates-io]
# wasip2 support (not yet released)
socket2 = { git = "https://github.com/rust-lang/socket2", branch = "master" }
mio = { git = "https://github.com/tokio-rs/mio", branch = "master" }
tokio = { git = "https://github.com/dicej/tokio", branch = "wasip2-take2" }